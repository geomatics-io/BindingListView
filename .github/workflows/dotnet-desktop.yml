name: Build & Pack NuGet Package

on:
  push:
    branches: [ master, development ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ master, development ]
  workflow_dispatch:

# Only the library itself (src/BindingListView) is built here, not the demos or
# tests/Issue2. Issue2 references commercial DevExpress packages that aren't
# available on a public CI runner without a private feed + license.
jobs:
  build-and-pack:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # MinVer derives the package version from the nearest reachable git tag
          # plus commit height. A shallow checkout (the default) hides tags and
          # history, so MinVer would always fall back to 0.0.0-alpha.0.
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The strong-name key is never committed to the repo (see .gitignore); it only
      # exists as the STRONG_NAME_KEY secret (base64-encoded .snk). BindingListView.csproj
      # only enables SignAssembly when this file is present, so builds that don't have the
      # secret (e.g. pull requests from forks, which GitHub withholds secrets from) still
      # succeed - they just produce an unsigned assembly instead of failing.
      - name: Write strong-name key from secret
        if: ${{ secrets.STRONG_NAME_KEY != '' }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.STRONG_NAME_KEY }}")
          [IO.File]::WriteAllBytes("src/BindingListView/BindingListView.snk", $bytes)

      - name: Restore
        run: dotnet restore src/BindingListView/BindingListView.csproj

      - name: Build
        run: dotnet build src/BindingListView/BindingListView.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/BindingListView/BindingListView.csproj --configuration Release --no-build --output "${{ github.workspace }}/artifacts"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg

      # Decides whether this tag is allowed to publish: it must be reachable from
      # (i.e. already merged into) origin/master, and must not be a "-beta" tag
      # (e.g. v1.4.0-beta or v1.4.0-beta.1). Beta tags and tags pushed only on a
      # feature/development branch still get built, packed and uploaded as a
      # workflow artifact above, just not pushed to NuGet.org automatically.
      - name: Determine release eligibility
        id: gate
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"

          on_master=false
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            on_master=true
          fi

          is_beta=false
          if [[ "$tag" == *-beta* ]]; then
            is_beta=true
          fi

          publish=false
          if [[ "$on_master" == true && "$is_beta" == false ]]; then
            publish=true
          fi

          echo "tag=$tag on_master=$on_master is_beta=$is_beta publish=$publish"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Publish to NuGet.org
        if: steps.gate.outputs.publish == 'true'
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.NUGET_API_KEY }}
          --skip-duplicate
